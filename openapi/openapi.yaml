openapi: 3.1.0
info:
  title: L_Platform Backend API
  description: Multi-tenant educational programming platform REST API
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /ready:
    get:
      summary: Readiness check (database connectivity)
      responses:
        '200':
          description: Service and database are ready
  /api/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful authentication
        '401':
          description: Invalid credentials
  /api/auth/refresh:
    post:
      summary: Refresh access token
      responses:
        '200':
          description: Token pair refreshed
        '401':
          description: Invalid or expired refresh token
  /api/auth/logout:
    post:
      summary: User logout
      responses:
        '200':
          description: Logged out
  /api/auth/me:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile information
  /api/organizations:
    get:
      summary: List organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated organizations
    post:
      summary: Create organization
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/users:
    get:
      summary: List users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated users
    post:
      summary: Create user
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/classes:
    get:
      summary: List classes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated classes
    post:
      summary: Create class
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/sections:
    get:
      summary: List sections
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated sections
    post:
      summary: Create section
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/courses:
    get:
      summary: List courses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated courses
    post:
      summary: Create course
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/allocations:
    get:
      summary: List course allocations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated allocations
    post:
      summary: Create course allocation
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/questions:
    get:
      summary: List questions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated questions
    post:
      summary: Create question
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/assignments:
    get:
      summary: List assignments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated assignments
    post:
      summary: Create assignment
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/submissions:
    get:
      summary: List submissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated submissions
    post:
      summary: Submit solution
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignmentId, questionId, language, code]
              properties:
                assignmentId:
                  type: string
                questionId:
                  type: string
                language:
                  type: string
                  enum: [PYTHON, JAVA, CPP]
                code:
                  type: string
      responses:
        '202':
          description: Submission accepted and stored as pending. The API does not execute submitted code; an isolated execution worker is not yet available.
          content:
            application/json:
              schema:
                type: object
                required: [id, assignmentId, questionId, studentId, language, status, score, results]
                properties:
                  id:
                    type: string
                  assignmentId:
                    type: string
                  questionId:
                    type: string
                  studentId:
                    type: string
                  language:
                    type: string
                    enum: [PYTHON, JAVA, CPP]
                  status:
                    type: string
                    enum: [PENDING]
                  score:
                    type: 'null'
                  totalTestCases:
                    type: integer
                  passedTestCases:
                    type: integer
                  results:
                    type: array
                    items: {}
  /api/dashboard/summary:
    get:
      summary: Dashboard summary counts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics
  /api/dashboard/teacher:
    get:
      summary: Teacher dashboard metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

