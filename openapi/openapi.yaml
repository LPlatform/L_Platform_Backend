openapi: 3.1.0
info:
  title: L_Platform Backend API
  description: Multi-tenant educational programming and AI learning platform REST API
  version: 1.1.0
servers:
  - url: http://localhost:3001
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /ready:
    get:
      summary: Readiness check (database connectivity)
      responses:
        '200':
          description: Service and database are ready
  /api/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful authentication
        '401':
          description: Invalid credentials
  /api/auth/refresh:
    post:
      summary: Refresh access token
      responses:
        '200':
          description: Token pair refreshed
        '401':
          description: Invalid or expired refresh token
  /api/auth/logout:
    post:
      summary: User logout
      responses:
        '200':
          description: Logged out
  /api/auth/me:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile information
  /api/organizations:
    get:
      summary: List organizations (PLATFORM_OWNER / scoped ORGANIZATION_ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated organizations
    post:
      summary: Create organization (PLATFORM_OWNER only)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/users:
    get:
      summary: List users (tenant-scoped; blocked for PLATFORM_DEVELOPER)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated users
    post:
      summary: Create user
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/users/import/preview:
    post:
      summary: Validate CSV user import rows without mutating database
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Validated preview rows
  /api/users/import/confirm:
    post:
      summary: Commit validated CSV user import rows
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Users imported
  /api/platform/roles:
    get:
      summary: List platform role capabilities and permission catalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role permission catalog
  /api/platform/integrations/status:
    get:
      summary: Report Supabase and OCI hybrid integration configuration status (no secrets)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Integration configuration summary
  /api/settings/reset-demo:
    post:
      summary: Reset development demo seed state (disabled in production)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Seed data reset
  /api/classes:
    get:
      summary: List classes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated classes
    post:
      summary: Create class
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/sections:
    get:
      summary: List sections
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated sections
    post:
      summary: Create section
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/sections/{id}/students/bulk:
    post:
      summary: Bulk enroll existing students by CSV email list
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrollment summary
  /api/courses:
    get:
      summary: List courses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated courses
    post:
      summary: Create course
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/allocations:
    get:
      summary: List course allocations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated allocations
    post:
      summary: Create course allocation
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/questions:
    get:
      summary: List questions (stripped answer keys/rubrics for STUDENT)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated questions
    post:
      summary: Create question with normalized options
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/assignments:
    get:
      summary: List assignments across all seven supported types
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated assignments
    post:
      summary: Create multi-question assignment
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/submissions:
    get:
      summary: List submissions (scoped by student/section/org; blocked for PLATFORM_DEVELOPER)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated submissions
    post:
      summary: Submit code, written, structured, or uploaded assignment work
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignmentId, questionId]
              properties:
                assignmentId:
                  type: string
                questionId:
                  type: string
                language:
                  type: string
                  enum: [PYTHON, JAVA, CPP, TEXT, DOCUMENT]
                code:
                  type: string
                textResponse:
                  type: string
                responseData:
                  type: object
                attachmentUrl:
                  type: string
                attachmentName:
                  type: string
      responses:
        '202':
          description: Submission accepted and stored without server-side arbitrary code execution.
          content:
            application/json:
              schema:
                type: object
                required:
                  [id, assignmentId, questionId, studentId, language, status, score, results]
                properties:
                  id:
                    type: string
                  assignmentId:
                    type: string
                  questionId:
                    type: string
                  studentId:
                    type: string
                  language:
                    type: string
                    enum: [PYTHON, JAVA, CPP, TEXT, DOCUMENT]
                  status:
                    type: string
                    enum: [PENDING, PENDING_REVIEW]
                  score:
                    type: 'null'
                  totalTestCases:
                    type: integer
                  passedTestCases:
                    type: integer
                  results:
                    type: array
                    items: {}
  /api/submissions/{id}/grade:
    patch:
      summary: Manually grade a submission and optionally release student feedback
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Submission graded
  /api/submissions/attachment-upload:
    post:
      summary: Issue scoped OCI Object Storage upload authorization for student submission attachment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed OCI upload target
        '503':
          description: OCI Object Storage not configured (fail closed)
  /api/submissions/{id}/attachment-download:
    get:
      summary: Issue scoped OCI Object Storage download authorization for authorized caller
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed OCI download target
        '503':
          description: OCI Object Storage not configured (fail closed)
  /api/dashboard/summary:
    get:
      summary: Dashboard summary counts (role & tenant scoped)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics
  /api/dashboard/teacher:
    get:
      summary: Teacher dashboard metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics
  /api/reports/onboarding-series:
    get:
      summary: Monthly student and teacher onboarding series
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Onboarding time series
  /api/assessments:
    get:
      summary: List course assessments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Assessment items
    post:
      summary: Create draft or published assessment with immutable question snapshots
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/assessments/{id}/publish:
    patch:
      summary: Publish assessment and freeze immutable question snapshots
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Published assessment
  /api/assessments/{id}/assign:
    post:
      summary: Assign a published assessment to a school section
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Assessment assigned to section
        '403':
          description: Forbidden for role or unassigned teacher section
  /api/teacher/assessment-reviews:
    get:
      summary: List teacher-scoped submitted assessment answers awaiting rubric review
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attempt review queue
  /api/teacher/assessment-answers/{answerId}/review:
    post:
      summary: Grade a student written/rubric assessment answer
      parameters:
        - in: path
          name: answerId
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Answer reviewed and attempt total recalculated
  /api/teacher/assessment-attempts/{attemptId}/release:
    post:
      summary: Release a graded assessment attempt score and feedback to the student
      parameters:
        - in: path
          name: attemptId
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attempt released to student
  /api/learning/courses:
    get:
      summary: List free platform courses and school-allocated courses visible to caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Courses list
  /api/learning/ai-readiness:
    get:
      summary: Get free platform-wide AI Readiness Course content
      description: Returns shared paraphrased course content when the course is published for any authenticated active user (PLATFORM_FREE access model).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Course metadata and eight learning modules
          content:
            application/json:
              schema:
                type: object
                required: [id, title, description, attribution, sourceTitle, modules]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  attribution:
                    type: string
                  sourceTitle:
                    type: string
                  modules:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          id,
                          title,
                          sourcePages,
                          introduction,
                          objectives,
                          concepts,
                          lessons,
                          revisionNotes,
                          practice,
                        ]
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        sourcePages:
                          type: string
                        introduction:
                          type: string
                        objectives:
                          type: array
                          items:
                            type: string
                        concepts:
                          type: array
                          items:
                            type: string
                        lessons:
                          type: array
                          items:
                            type: object
                            required: [title, content, activity]
                            properties:
                              title:
                                type: string
                              content:
                                type: string
                              activity:
                                type: string
                        revisionNotes:
                          type: array
                          items:
                            type: string
                        practice:
                          type: array
                          items:
                            type: string
        '401':
          description: Authentication required
        '404':
          description: Course is missing or unpublished
  /api/learning/classes:
    get:
      summary: List active student class/section enrollments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Joined student sections
  /api/learning/classes/join:
    post:
      summary: Join an active class section in the student organization by join code or URL
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Already enrolled in matching active section
        '201':
          description: Joined matching active section
        '403':
          description: Student is not linked to an organization
        '404':
          description: Matching active section not found in student organization
  /api/learning/lesson-progress:
    get:
      summary: List completed lesson IDs for the authenticated student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Completed lesson records
  /api/learning/progress/lessons:
    post:
      summary: Mark a platform course lesson as completed for the authenticated student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lesson progress recorded
  /api/learning/assessments:
    get:
      summary: List published platform assessments and school-assigned assessments for student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student-accessible assessments
  /api/learning/assessments/{assignmentId}/attempts:
    post:
      summary: Start or resume an assessment attempt (accepts assignmentId or platform assessmentId)
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attempt payload with sanitized questions and unwrapped saved answers
  /api/learning/attempts/{attemptId}/answers/{questionId}:
    put:
      summary: Save or update a student answer for an in-progress attempt
      parameters:
        - in: path
          name: attemptId
          required: true
          schema:
            type: string
        - in: path
          name: questionId
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved answer status
  /api/learning/attempts/{attemptId}/submit:
    post:
      summary: Submit assessment attempt and run objective scoring or route to teacher review
      parameters:
        - in: path
          name: attemptId
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Submission result
  /api/learning/progress:
    get:
      summary: Aggregate completed lesson count and assessment progress for the authenticated student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student learning progress summary
  /api/learning/results:
    get:
      summary: List historical student attempts with gated score and released breakdowns
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student results
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
