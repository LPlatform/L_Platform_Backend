name: OpenAPI Contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      spec-configured: ${{ steps.contract.outputs.configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: contract
        shell: bash
        run: |
          if [[ -f openapi/openapi.yaml ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'OpenAPI validation/package: SKIPPED (no openapi/openapi.yaml).' >> "$GITHUB_STEP_SUMMARY"
          fi
  validate-and-package:
    needs: readiness
    if: needs.readiness.outputs.spec-configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - name: Lint OpenAPI specification
        run: npx --yes @redocly/cli@2.64.1 lint openapi/openapi.yaml
      - name: Package commit-pinned CI contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-${{ github.sha }}
          path: openapi/openapi.yaml
          if-no-files-found: error
          retention-days: 90
