name: API Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run API tests when configured
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then echo '::notice::API package/tests are not configured.'; exit 0; fi
          corepack enable && corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm test:unit
          pnpm test:integration
