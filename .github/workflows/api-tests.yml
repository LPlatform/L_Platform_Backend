name: API Integration Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      product-configured: ${{ steps.project.outputs.configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: project
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'API integration tests: SKIPPED (no package.json).' >> "$GITHUB_STEP_SUMMARY"
          fi
  api-tests:
    needs: readiness
    if: needs.readiness.outputs.product-configured == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: lplatform_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d lplatform_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/lplatform_test
      NODE_ENV: test
      ENABLE_DEMO_RESET: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:integration
