name: Backend Release
on:
  push:
    tags: ['backend-v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Validate SemVer tag and main ancestry
        run: |
          [[ "$TAG" =~ ^backend-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$TAG" origin/main
      - name: Refuse an existing release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            echo 'A GitHub Release already exists for this tag; refusing to overwrite it.'
            exit 1
          fi
  build-test-scan:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-bookworm
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: lplatform_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d lplatform_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Require initialized backend and Dockerfile
        run: test -f package.json && test -f pnpm-lock.yaml && test -f Dockerfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run production-quality checks
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lplatform_test
        run: |
          pnpm format:check && pnpm lint && pnpm typecheck
          pnpm test:unit && pnpm test:integration
          pnpm db:migrate:test-clean && pnpm db:migrate:test-upgrade
          pnpm build
      - name: Build immutable commit-addressed container
        env:
          IMAGE_REF: lplatform-backend:${{ github.sha }}
        run: docker build --pull --tag "$IMAGE_REF" .
      - name: Scan container
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: lplatform-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Prepare immutable release assets
        shell: bash
        run: |
          mkdir -p release-assets
          docker image inspect "lplatform-backend:$GITHUB_SHA" --format '{{.Id}}' > release-assets/container-image-id.txt
          docker save "lplatform-backend:$GITHUB_SHA" -o release-assets/backend-image.tar
          sha256sum release-assets/backend-image.tar > release-assets/SHA256SUMS.txt
          if [[ -f openapi/openapi.yaml ]]; then
            npx --yes @redocly/cli@2.64.1 lint openapi/openapi.yaml
            cp openapi/openapi.yaml "release-assets/openapi-${TAG}.yaml"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-release-${{ github.sha }}
          path: release-assets/**
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build-test-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-release-${{ github.sha }}
          path: release-artifacts
      - name: Create release with verified artifacts and generated notes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            echo 'A GitHub Release already exists for this tag; refusing to overwrite it.'
            exit 1
          fi
          mapfile -t assets < <(find release-artifacts -type f -print)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" "${assets[@]}" --generate-notes --verify-tag
