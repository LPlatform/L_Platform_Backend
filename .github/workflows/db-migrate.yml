name: Supabase DB Migrate
# Applies idempotent migrations (and optional seed) to the Supabase Postgres in GitHub secret DATABASE_URL.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Also run the additive seed (demo data). Not for real production.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: db-migrate
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: 'true'
      NODE_ENV: production
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require secret
        run: test -n "$DATABASE_URL" || { echo 'Add DATABASE_URL to the production environment secrets.'; exit 1; }
      - run: pnpm db:migrate
      - if: inputs.seed
        run: ALLOW_PROD_SEED=true pnpm db:seed
