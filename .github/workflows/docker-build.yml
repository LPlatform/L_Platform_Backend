name: Docker Build and Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      docker-configured: ${{ steps.project.outputs.configured }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: project
        shell: bash
        run: |
          if [[ -f Dockerfile ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Container build/scan: SKIPPED (no Dockerfile).' >> "$GITHUB_STEP_SUMMARY"
          fi
  image:
    needs: readiness
    if: needs.readiness.outputs.docker-configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build commit-addressed image
        env:
          IMAGE_REF: lplatform-backend:${{ github.sha }}
        run: |
          docker build --pull --tag "$IMAGE_REF" .
          docker image inspect "$IMAGE_REF" --format '{{.Id}}' | tee image-id.txt
          echo "Built local image ref $IMAGE_REF (not published to a registry)." >> "$GITHUB_STEP_SUMMARY"
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: lplatform-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
