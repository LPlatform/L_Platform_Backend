name: Docker Build and Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image when Dockerfile is configured
        id: build
        run: |
          if [[ ! -f Dockerfile ]]; then echo '::notice::No Dockerfile; image build/scan and OCI publication are not configured.'; echo 'built=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          docker build --pull --tag lplatform-backend:ci .
          docker image inspect lplatform-backend:ci --format '{{.Id}}'
          echo 'built=true' >> "$GITHUB_OUTPUT"
      - name: Scan image for vulnerabilities
        if: steps.build.outputs.built == 'true'
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: lplatform-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
