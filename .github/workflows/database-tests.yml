name: Database and Migration Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: lplatform_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d lplatform_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate clean and upgrade migrations
        shell: bash
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/lplatform_test
        run: |
          if [[ ! -f package.json ]]; then echo '::notice::ORM and migrations are not configured; clean/upgrade migration tests are unavailable.'; exit 0; fi
          corepack enable && corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm db:migrate:test-clean
          pnpm db:migrate:test-upgrade
