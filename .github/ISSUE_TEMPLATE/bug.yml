name: Bug report
description: Report a reproducible issue without secrets or production data
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary and reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: This report contains no secrets or production user data
          required: true
